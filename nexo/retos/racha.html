<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="NEXO: racha de retos diarios."><title>Racha · NEXO</title><link rel="stylesheet" href="../css/main.css"></head><body><main class="main container"><div class="page-title"><div class="eyebrow">NEXO / Retos</div><h1>📅 Racha</h1><p>No pierdas tus días consecutivos.</p></div><div id="streak-page" class="card center"></div></main><script src="../js/storage.js"></script><script src="../js/xp.js"></script><script src="../js/achievements.js"></script><script src="../js/stats.js"></script><script src="../js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const s=NexoStore.loadState(),days=s.stats.streak,goal=days>=30?'¡Racha legendaria!':`Faltan ${30-days} días para la insignia de 30 días.`;document.getElementById('streak-page').innerHTML=`<div class="icon">🔥</div><div style="font-size:3rem;font-weight:900">${days}</div><p>días consecutivos</p><div class="progress"><span style="width:${Math.min(100,days/30*100)}%"></span></div><p>${goal}</p><a class="btn primary" href="index.html">Ver reto de hoy</a>`})</script></body></html>
