<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="NEXO: tu perfil y progreso."><title>Perfil · NEXO</title><link rel="stylesheet" href="../css/main.css"></head><body><main class="main container"><div class="page-title"><div class="eyebrow">NEXO / Perfil</div><h1>👤 Perfil</h1><p>Tu progreso y logros.</p></div><div class="grid g2"><section class="card"><div class="section-head"><h3><span data-name>Jugador</span></h3><button class="btn secondary small" data-edit-name>Cambiar nombre</button></div><div id="pxp" style="font-size:2rem;font-weight:900">0 XP</div><p>Nivel <strong id="plevel">1</strong> · <strong id="pname">Novato</strong></p><div class="progress"><span id="pbar"></span></div><p id="pnext"></p></section><section class="card"><h3>📊 Estadísticas</h3><div class="statgrid"><div class="stat"><strong id="pgames">0</strong><span>Partidas</span></div><div class="stat"><strong id="pquizzes">0</strong><span>Quizzes</span></div><div class="stat"><strong id="pcorrect">0</strong><span>Correctas</span></div><div class="stat"><strong id="pquestions">0</strong><span>Preguntas</span></div><div class="stat"><strong id="precords">0</strong><span>Récords</span></div><div class="stat"><strong id="pstreak">0</strong><span>Racha</span></div></div></section></div><section class="section"><h2>🏅 Logros</h2><div class="grid g2" id="ach" style="margin-top:12px"></div></section><section class="section"><div class="card"><h3>Zona de pruebas</h3><p>El progreso se guarda solo en este navegador.</p><button class="btn danger small" data-reset>Borrar progreso</button></div></section></main><script src="../js/storage.js"></script><script src="../js/xp.js"></script><script src="../js/achievements.js"></script><script src="../js/stats.js"></script><script src="../js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const s=NexoStore.loadState(),l=NexoXP.levelInfo(s.profile.xp),pct=l.next?Math.round((s.profile.xp-l.xp)/(l.next.xp-l.xp)*100):100;pxp.textContent=s.profile.xp.toLocaleString('es-ES')+' XP';plevel.textContent=s.profile.level;pname.textContent=l.name;pbar.style.width=pct+'%';pnext.textContent=l.next?s.profile.xp+' / '+l.next.xp+' XP para nivel '+l.next.level:'Nivel máximo definido: 50';pgames.textContent=s.stats.gamesPlayed;pquizzes.textContent=s.stats.quizzesCompleted;pcorrect.textContent=s.stats.correctAnswers;pquestions.textContent=s.stats.questionsAnswered;precords.textContent=s.stats.records;pstreak.textContent=s.stats.streak;ach.innerHTML=NexoAch.ACHIEVEMENTS.map(a=>{const ok=s.achievements.includes(a[0]);return '<article class="card achievement '+(ok?'':'locked')+'"><div class="aicon">'+a[1]+'</div><div><strong>'+a[2]+'</strong><p>'+ (ok?'Desbloqueado':'Aún bloqueado') +'</p></div></article>'}).join('')})</script></body></html>
